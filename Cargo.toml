[package]
name = "ikigai-store"
description = "The PERSISTENT RDF store for ikigai — UNFINISHED. What is here today is an in-memory placeholder; the durable, restart-surviving backend the crate is named for is not built yet."
# ★ UNFINISHED, NOT DEPRECATED — and `publish = false` is the guard, not an obituary.
#
# This crate's PURPOSE, written here because it has never been written anywhere:
#
#   > I think the original purpose was to have a store that was backed by a persistent
#   > mechanism like the rocksdb implementation. Keep it and we'll migrate it to that.
#   >   — Brian, 2026-09-12
#
# So `ikigai-store` is the crate that OWNS DURABLE RDF: a dataset that survives a
# process restart, opened from a path rather than rebuilt from source on every boot.
# Nothing in the ecosystem does that today. `ikigai-sparql` deliberately does not: its
# `space()` builds a dataset per query and drops it, and `space_with_store(Arc<Store>)`
# takes a store the CALLER owns and never says where that store's bytes live. This
# crate is meant to be the answer to "where do they live", and then to hand its
# `Arc<Store>` to `space_with_store` so the query surface is not written twice.
#
# ⚠ What is in `src/lib.rs` right now is a PLACEHOLDER for that store, not the store:
# `Store::new()` (in-memory), a `load_turtle` side door, and one un-gated `Source`. It
# has stood there since the M2 scaffold (`47ea17e`, "Add M2 SPARQL endpoint: in-memory
# Oxigraph store") and nothing has ever consumed it.
#
# ★ HOW THE RECORD WENT WRONG, twice, the same way both times:
#   - 2026-08-08: "grow ikigai-sparql rather than publish ikigai-store" was decided in a
#     brief and nowhere else, so the lockstep 0.1.70 sweep published this crate anyway
#     on 2026-09-12 — one version, zero downloads. Brian should YANK 0.1.70: it is an
#     in-memory placeholder wearing the name of a persistent store.
#   - 2026-09-12: the arc that noticed that (core #109) compared this placeholder
#     against a finished `ikigai-sparql` and concluded "vestige, superseded", writing
#     DEPRECATED into this manifest, the crate docs and the README. Its findings about
#     the CODE were all correct (they are the work list below). Its conclusion was
#     wrong, because the crate's purpose lived only in Brian's head — and comparing a
#     placeholder to a finished crate can only ever conclude redundancy.
# Both failures are one failure: a fact nobody wrote in the repo does not survive
# contact with a process. That is what these lines are for.
#
# ★ WHAT WOULD MAKE THIS PUBLISHABLE AGAIN — the condition, so the guard can be lifted
# by evidence rather than by mood. Every item is something core #109 found MISSING from
# the placeholder and is therefore a requirement, not a wish:
#   1. A durable backend: `Store::open(path)` behind an explicit feature, with the
#      config home (not an env var) naming the path, and honest behaviour when the
#      path is unwritable (fail loud).
#   2. A `Verb::Sink` that loads through the kernel — `load_turtle` mutates the store
#      out of band, where no capability check and no thread cut can see it.
#   3. Declared = enforced capabilities on BOTH directions. Today a
#      `SELECT * { ?s ?p ?o }` is answered for any attenuated caller with no `requires`
#      at all.
#   4. A golden thread the writer cuts, and reads that may then be `.cacheable()` —
#      the coverage argument in `ikigai-sparql`'s `UPDATE_THREAD` docs turns in this
#      crate's favour exactly when the store OWNS its data instead of sharing a raw
#      handle.
#   5. Typed inputs (`ArgSpec::class`) and an `as` selector. The placeholder declares
#      two outputs and gives no caller any way to choose between them, and its `query`
#      arg has no class — so an `ikigai-conformance` walk of it probes NOTHING.
#   6. An `ikigai-conformance` test, from day one.
#   7. A namespace this crate owns. The placeholder's tests and README bind
#      `urn:sparql:default`, inside a namespace `ikigai-sparql` owns: a host binding
#      both would offer an agent two indistinguishable query actions over two different
#      stores, and the one declaring no capability is the one that answers an
#      unrestricted query.
#
# ⚠ And the decision that comes BEFORE all of that: a RocksDB-backed store probably
# does not belong in this workspace at all — see this crate's README, "Where this
# should live". `ikigai-fs` (#21) and `ikigai-shacl` (#52) both left the core
# workspace for their own repos; this is the last module crate in it.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1"
# `0.1` is the TRUE minimum here, not an un-audited family pin (2026-09-06): every
# core item this crate names — `Endpoint`/`Invocation::inline_str`, `Representation`,
# `ReprType`, `Error::Endpoint`, `Description`/`ArgSpec` and their builders — was
# already public before 0.1.0. Verified two ways: `git log -S` puts every
# introducing commit in the 0.0.0 pre-release era, and a standalone copy of this
# crate's lib compiles clean against `ikigai-core = "=0.1.0"`. Re-audit whenever a
# new core item is used: a pin BELOW the API you call stays green under fmt, clippy,
# test and CI (the path dep satisfies the call) and fails only at
# `cargo publish --dry-run`. That is what happened to `ikigai-vocab` in 0.1.66.
ikigai-core = { path = "../ikigai-core", version = "0.1" }
# In-memory store only: default-features=false drops the RocksDB (C++) backend,
# whose `oxrocksdb-sys` is also gated out of wasm by Oxigraph itself.
oxigraph = { version = "0.5", default-features = false }

# On wasm, Oxigraph needs its `js` feature (getrandom wasm backend) to build.
[target.'cfg(target_family = "wasm")'.dependencies]
oxigraph = { version = "0.5", default-features = false, features = ["js"] }

[dev-dependencies]
futures = "0.3"
# Tests only, and `0.1` is likewise the audited minimum: the single item used is
# `TurtleRenderer`, public since before 0.1.0. Note the resolution consequence —
# vocab 0.1.66 now requires core 0.1.66, so the TEST graph is pulled to that even
# though the lib above genuinely builds on 0.1.0.
ikigai-vocab = { path = "../ikigai-vocab", version = "0.1" }
