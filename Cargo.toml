[package]
name = "ikigai-store"
description = "The persistent RDF store for ikigai: a dataset opened from a path and owned by one process, exposed as urn:iki:store:{query,info,update,load} with capability-gated reads and writes, and reads that are cacheable because nothing else can write."
# ★ THE CRATE'S PURPOSE, written here because it once lived only in Brian's head and the
# record went wrong twice for exactly that reason:
#
#   > I think the original purpose was to have a store that was backed by a persistent
#   > mechanism like the rocksdb implementation. Keep it and we'll migrate it to that.
#   >   — Brian, 2026-09-12
#
# `ikigai-store` OWNS DURABLE RDF: a dataset that survives a process restart, opened from
# a path rather than rebuilt from source on every boot. `ikigai-sparql` deliberately does
# not do this — its `space()` builds a dataset per query and drops it, and
# `space_with_store(Arc<Store>)` takes a store the CALLER owns and never says where that
# store's bytes live. This crate is the answer to "where do they live".
#
# ★ HOW THE RECORD WENT WRONG, twice, the same way both times — kept because deleting it
# is how it would happen a third time:
#   - 2026-08-08: "grow ikigai-sparql rather than publish ikigai-store" was decided in a
#     brief and nowhere else, so the lockstep 0.1.70 sweep published the crate anyway on
#     2026-09-12 — one version, an in-memory placeholder wearing the name of a persistent
#     store. YANKED by Brian 2026-09-13, at 9 downloads.
#   - 2026-09-12: the arc that noticed compared that placeholder against a finished
#     `ikigai-sparql` and concluded "vestige, superseded", writing DEPRECATED into this
#     manifest. Its findings about the CODE were all correct — they became the work list
#     this version completes. Its conclusion was wrong, because comparing a placeholder
#     to a finished crate can only conclude redundancy.
# Both failures are one failure: a fact nobody wrote in the repo does not survive contact
# with a process.
#
# ★ WHERE THIS LIVES — its own repo since 2026-09-13 (decided in `ikigai-core` #110,
# executed as #111), with the crate's 13 commits of history carried across by
# `git subtree split`. NOT because of wasm: `wasm-check` runs with DEFAULT features and
# Oxigraph target-gates `oxrocksdb-sys` off wasm regardless (measured — a crate with
# RocksDB on `cargo check`s clean for wasm32 in 10 s). Because of NATIVE COMPILE COST
# charged to the foundation (`oxrocksdb-sys` = 494 s of CPU on a cache miss, under
# `cargo check`, because it is a build script), because of LOCKSTEP VERSIONING (which is
# how this crate got published by accident), and because of PRECEDENT twice in that same
# workspace (`ikigai-fs` #21, `ikigai-shacl` #52).
#
# ★ PUBLISHABLE since 2026-09-13. `ikigai-core` #110 set seven conditions for lifting
# `publish = false`; 0.2.0 meets all seven, 0.1.70 is yanked, and Brian lifted the guard:
#   1. durable backend behind an explicit feature, path from the config home, loud on an
#      unwritable path                                          → src/store.rs, src/config.rs
#   2. a `Verb::Sink` that loads through the kernel (`load_turtle` is gone)  → src/endpoints.rs
#   3. declared = enforced capabilities on BOTH directions, ablation-tested  → tests/endpoints.rs
#   4. a golden thread the writer cuts, and reads cacheable under it        → tests/endpoints.rs
#   5. typed inputs and an `as` selector that refuses rather than substitutes
#   6. an `ikigai-conformance` walk                                          → tests/conformance.rs
#   7. a namespace this crate owns (`urn:iki:store:`, born migrated)
#
# ⚠ The guard is off, so the thing it guarded against is possible again: this crate is now
# reachable by any sweep that publishes what it finds. It is NOT in a lockstep workspace
# any more (that is half of why it moved), so a release here is a deliberate act on one
# crate — keep it that way. Publishing remains Brian's, always.
# 0.2.0, not a patch onto 0.1.70: crates.io never re-uses a yanked version, and this code
# has none of the shape the number 0.1.70 was attached to.
#
# ★ 0.2.1 is a PATCH and that is deliberate, not laziness. Everything it adds is
# additive — a `bindings` argument that is optional, a new `urn:iki:store:graph-update`
# IRI and its capability, a third golden thread that only ever invalidates MORE, and the
# `sparql` module. Nothing existing changed shape. Under cargo's 0.x rules the second
# number is the BREAKING one, so bumping to 0.3.0 would force `ikigai-ledger` and
# `ikigai-cli` — both live on `^0.2` — to edit a manifest for a release that breaks
# nothing, which is exactly the ceiling trap constitution 5 warns about from the other
# direction. A consumer that wants the new API pins `0.2.1`; one that does not, does
# nothing.
#
# ★ 0.2.2 is a PATCH by the same argument, and closes the half 0.2.1 left open. It adds
# `urn:iki:store:graph-{select,ask,construct,describe}`, `urn:cap:store:read:graph:*` and
# `cap_read_graph` — four new IRIs, one new capability, nothing existing changed. The
# urgency is not tidiness: 0.2.1 segmented WRITES and left `urn:cap:store:read` as the
# whole dataset, so a module enforcing its own read capability over the graph it owns
# could be gone around by a caller who holds the broad grant and queries this store
# directly. A boundary with a documented bypass is not a boundary.
#
# ★ 0.2.3 is a PATCH that fixes a crate which DID NOT COMPILE for a real class of
# consumer. 0.2.2 matched `oxrdf::Term` exhaustively behind a comment reasoning that the
# RDF-star variant is "behind a feature nothing here enables" — true of this crate's own
# graph, false under cargo feature unification, which is global. Any sibling enabling
# `oxrdf/rdf-12` adds `Term::Triple`; `ikigai-cli` has one (rudof, through
# `ikigai-shacl`), so 0.2.2 failed there with E0004 the moment it was pinned. The API is
# unchanged: one match arm, one gate feature, one CI input.
# ⚠ The lesson is the gate, not the arm. Every gate was GREEN on 0.2.2 because `ci.yml`
# passed `features: persistent` and this crate's own graph has no `rdf-12` in it —
# constitution 9c/9e, a gate covering less than it appears to. `features: "*"` plus the
# `rdf-12` pass-through below closes this instance; it does NOT close the class, because
# `--all-features` can only enable features this manifest declares. See the long note in
# `.github/workflows/ci.yml`.
version = "0.2.3"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-store"
homepage = "https://github.com/ikigai-rs/ikigai-store"
keywords = ["ikigai", "roc", "rdf", "sparql", "store"]
categories = ["database-implementations"]

[features]
# In-memory by default, exactly the trade `ikigai-cli` makes for `quic` and `web`: the
# heavy backend is opt-in so the wasm face and cheap tests survive. ⚠ `ci.yml` MUST pass
# `features: "*"` (it did pass `persistent`, which was not enough — see `rdf-12` below):
# a `cfg(feature)` path inside a library is not a TARGET, so `ci-drift`'s
# `required-features` check cannot see an omission here and nothing would lint or test
# the durable path.
default = []
# ⚠ Cargo feature unification is global and additive, and `rocksdb` is a DEFAULT feature
# of oxigraph that the dependency below turns off. Enabling this anywhere in a host's
# graph gives EVERY oxigraph consumer in that build the RocksDB backend, `ikigai-sparql`'s
# copy included. That is what makes the `space_with_store` composition work (one `Store`
# type either way) and it means "off by default" is a property of the build, not of this
# crate.
persistent = ["oxigraph/rocksdb"]
# ⚠ NOT a feature for this crate's own use — a GATE, and the only one that can see the
# break that shipped as 0.2.2. `oxrdf`'s `Term` grows a fourth variant under `rdf-12`, so
# a match on `Term` that is exhaustive in THIS crate's graph is non-exhaustive in a
# consumer's the moment any sibling enables it (`ikigai-cli` does: rudof, via
# `ikigai-shacl`). Nothing this crate declared could see that, because the feature is a
# DEPENDENCY's, so `ci.yml` now passes `features: "*"` and this line is what `*` reaches.
# ★ It is a gate and NEVER a `cfg`: a consumer enabling `oxrdf/rdf-12` through rudof does
# NOT enable this feature, so `#[cfg(feature = "rdf-12")]` on a match arm would be false
# exactly where the variant exists — the same break wearing a fix's clothes. The one
# sound direction is the other one: this feature ON implies the variant exists, which is
# why the test that constructs a quoted triple may be cfg'd on it and the arm may not.
rdf-12 = ["oxigraph/rdf-12"]

[dependencies]
async-trait = "0.1"
# 0.1.57 is the TRUE minimum and it is `data_home` (#87) that sets it: `config.rs`
# defaults the dataset directory under the data home, and that function exists nowhere
# earlier. The next floors down, for whoever re-audits: `config_home`/`layered_paths_in`
# are 0.1.56 (#86), `Error::Unavailable` — the typed, transient refusal a held lock
# returns — is 0.1.45 (#70), and everything else named here (`Endpoint`, `Invocation`,
# `Representation`, `ArgSpec::{class,one_of,default_value}`, `Description::requires`)
# predates 0.1.0.
# ⚠ `"0.1.57"` is a CEILING as well as a floor — `>=0.1.57, <0.2.0`. When core reaches
# 0.2 this line must move, or this crate silently freezes out of every release after it.
ikigai-core = "0.1.57"
# In-memory store by default; `persistent` turns the RocksDB backend back on. Oxigraph
# itself gates `oxrocksdb-sys` out of wasm by target, so the feature pulls in nothing
# there — and this crate's durable constructors are gated off wasm too, so `persistent`
# on wasm compiles to exactly the default build. That is deliberate: a wasm-only fallback
# branch would be code no CI job can reach (checked: `cargo clippy --lib --target
# wasm32-unknown-unknown --features persistent` is clean and adds nothing).
oxigraph = { version = "0.5", default-features = false }
# The layered `store.toml`. `deny_unknown_fields` on the layer type is what makes a
# misspelled key loud instead of ignored. Both crates are pure Rust and wasm-clean.
serde = { version = "1", features = ["derive"] }
# The `bindings=` argument's wire shape is the SPARQL 1.1 Query Results JSON term object
# — the same shape a row comes back in, so a value read out of one query binds into the
# next without conversion. JSON rather than a line format because JSON's own types make
# string/number/boolean/object unambiguous, and because a consumer's JSON library does
# the escaping instead of the consumer. Pure Rust and wasm-clean, like everything else
# here.
serde_json = "1"
toml = "0.8"

# On wasm, Oxigraph needs its `js` feature (getrandom wasm backend) to build.
[target.'cfg(target_family = "wasm")'.dependencies]
oxigraph = { version = "0.5", default-features = false, features = ["js"] }

[dev-dependencies]
futures = "0.3"
# The module recipe as one test, from day one — condition 6. 0.3.0 for the AUTHORITY
# check, which exists for Sinks like this crate's: a mutating action that declares no
# `requires` and mutates anyway under a capability holding no grants. Both write doors
# here declare a scope, so AUTHORITY is silent on them by design — it is ENFORCED that
# holds those, in both directions, and `tests/graph_scope.rs` that ablates the
# parameterized half the suite cannot see.
# ⚠ 0.3 rather than 0.2 is a CEILING move as well as a floor: `"0.2"` means `<0.3.0`, so
# the new check would never have arrived on its own.
ikigai-conformance = "0.3"
# `TurtleRenderer` for the `Meta` face the kernel routes. ⚠ Resolution consequence worth
# knowing: vocab 0.1.70 requires core 0.1.66, so the TEST graph is pulled to that even
# though the library above genuinely builds on 0.1.57.
ikigai-vocab = "0.1"
