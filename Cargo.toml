[package]
name = "ikigai-store"
description = "DEPRECATED - superseded by ikigai-sparql's space_with_store + urn:sparql:update."
# ★ DEPRECATED 2026-09-12, and NOT PUBLISHED AGAIN.
#
# `publish = false` is the machine-checkable half of a decision that was already
# made in prose and then quietly undone. The record (2026-08-08, in
# `ikigai-devtools/claude/briefs/ikigai-linkeddata-shared-store.md`) reads: "grow
# ikigai-sparql rather than publish ikigai-store". That happened —
# `ikigai_sparql::space_with_store` shipped, and with it `urn:sparql:update`. But
# nothing in this manifest said so, so the lockstep 0.1.70 sweep published this
# crate anyway on 2026-09-12: one version, zero downloads, zero consumers, and a
# standing decision contradicted by a release. A decision that lives only in a
# brief is a memory, and memory is what failed. This line is not.
#
# What supersedes it, item for item (`ikigai-sparql` 0.1.9):
#   holding a dataset  -> `space_with_store(Arc<Store>)`, caller-owned, with
#                         `pub use oxigraph::store::Store` so hosts name ONE type
#   putting triples in -> `urn:sparql:update`, a `Verb::Sink` applying SPARQL 1.1
#                         UPDATE in one transaction (`INSERT DATA { GRAPH <g> … }`
#                         loads a named graph, `DROP GRAPH <g>` drops one)
#   authority          -> `CAP_UPDATE` ("urn:cap:sparql:update"), declared and
#                         therefore enforced, with an ablation test
#   golden thread      -> `UPDATE_THREAD`, cut by the kernel's automatic
#                         target-named cut on a successful sink
#   querying           -> `urn:sparql:{select,ask,describe,construct}`, typed
#                         inputs, `as` with `one_of` + a default, per-form outputs
# What remains here that is not there: `Store::new()`, `load_from_slice(Turtle, …)`
# and `&Store` — three lines of oxigraph, behind an endpoint that binds
# `urn:sparql:default` inside a namespace another crate owns, with no `requires`
# on a `SELECT * { ?s ?p ?o }`.
#
# Removal from the workspace waits on `cargo yank --version 0.1.70 ikigai-store`,
# so the published crate's `repository` link keeps pointing at real source until
# then. See this crate's README for the full argument.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1"
# `0.1` is the TRUE minimum here, not an un-audited family pin (2026-09-06): every
# core item this crate names — `Endpoint`/`Invocation::inline_str`, `Representation`,
# `ReprType`, `Error::Endpoint`, `Description`/`ArgSpec` and their builders — was
# already public before 0.1.0. Verified two ways: `git log -S` puts every
# introducing commit in the 0.0.0 pre-release era, and a standalone copy of this
# crate's lib compiles clean against `ikigai-core = "=0.1.0"`. Re-audit whenever a
# new core item is used: a pin BELOW the API you call stays green under fmt, clippy,
# test and CI (the path dep satisfies the call) and fails only at
# `cargo publish --dry-run`. That is what happened to `ikigai-vocab` in 0.1.66.
ikigai-core = { path = "../ikigai-core", version = "0.1" }
# In-memory store only: default-features=false drops the RocksDB (C++) backend,
# whose `oxrocksdb-sys` is also gated out of wasm by Oxigraph itself.
oxigraph = { version = "0.5", default-features = false }

# On wasm, Oxigraph needs its `js` feature (getrandom wasm backend) to build.
[target.'cfg(target_family = "wasm")'.dependencies]
oxigraph = { version = "0.5", default-features = false, features = ["js"] }

[dev-dependencies]
futures = "0.3"
# Tests only, and `0.1` is likewise the audited minimum: the single item used is
# `TurtleRenderer`, public since before 0.1.0. Note the resolution consequence —
# vocab 0.1.66 now requires core 0.1.66, so the TEST graph is pulled to that even
# though the lib above genuinely builds on 0.1.0.
ikigai-vocab = { path = "../ikigai-vocab", version = "0.1" }
