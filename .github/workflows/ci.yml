name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cancel main
jobs:
  ci:
    uses: ikigai-rs/.github/.github/workflows/rust.yml@main
    # `features: persistent` is NOT optional and must never be dropped. The durable
    # backend lives behind `#[cfg(feature = "persistent")]`, and a cfg path inside a
    # LIBRARY is not a target — so `ci-drift`'s `required-features` check cannot see its
    # absence, `--all-targets` does not reach it, and without this line nothing lints or
    # tests the entire reason this crate exists. Same family as constitution 9c: a gate
    # that silently covers less than it looks like it does. It costs an `oxrocksdb-sys`
    # build (~494 s of CPU) on a cache miss and is cached by `Swatinem/rust-cache`
    # thereafter.
    #
    # `wasm-lib: true` keeps the in-memory face honest: it runs with DEFAULT features, so
    # it lints exactly the half of this crate that has no RocksDB in it.
    with: { features: persistent, wasm-lib: true }
